resources:
  jobs:
    retail_medallion_pipeline:
      name: retail_medallion_pipeline
      email_notifications:
        on_success:
          - your-team@example.com
        on_failure:
          - your-team@example.com
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: notebooks/bronze_ingestion
            source: GIT
          max_retries: 1
          min_retry_interval_millis: 120000
          disable_auto_optimization: true
        - task_key: silver_cleaning
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: notebooks/silver_cleaning
            source: GIT
          max_retries: 1
          min_retry_interval_millis: 120000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: gold_modeling
          depends_on:
            - task_key: silver_cleaning
          notebook_task:
            notebook_path: notebooks/gold_modeling
            source: GIT
          max_retries: 1
          min_retry_interval_millis: 120000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: ecommerce_marts
          depends_on:
            - task_key: gold_modeling
          notebook_task:
            notebook_path: marts/ecommerce_marts
            source: GIT
          max_retries: 1
          min_retry_interval_millis: 120000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: instacart_marts
          depends_on:
            - task_key: gold_modeling
          notebook_task:
            notebook_path: marts/instacart_marts
            source: GIT
          max_retries: 1
          min_retry_interval_millis: 120000
          disable_auto_optimization: true
          environment_key: Default
      git_source:
        git_url: https://github.com/Sourabh-0501/retail-digital-assortment-analytics
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: STANDARD
